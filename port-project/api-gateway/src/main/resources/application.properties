server.port=8080

spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=carrier-service
spring.cloud.gateway.routes[1].uri=lb://CARRIER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/carriers/**

spring.cloud.gateway.routes[2].id=container-service
spring.cloud.gateway.routes[2].uri=lb://CONTAINER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/containers/**

spring.cloud.gateway.routes[3].id=yard-service
spring.cloud.gateway.routes[3].uri=lb://YARD-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/yard/**

spring.cloud.gateway.routes[4].id=gate-service
spring.cloud.gateway.routes[4].uri=lb://GATE-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/gate/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
